# TumThai release builds: Windows (Velopack Setup + Portable + update feed), Linux AppImages (x86_64 and aarch64),
# macOS .app zips (Apple Silicon and Intel) and the Android APK (arm64).
#
# Runs on a pushed tag `v<version>` (e.g. v2026.1012.0: builds that version and attaches everything to a GitHub
# Release for the tag) or by hand (Actions -> TumThai release -> Run workflow, with a version: artifacts only).
# The version goes in through a temporary Directory.Build.rsp (-p:Version=...), as ~/.cache/somtum-dist/lazer/build.sh
# does it, because osu.Desktop.csproj pins Version 0.0.0 for local builds.
#
# Repository secrets (Settings -> Secrets and variables -> Actions), all optional:
#   ANDROID_KEYSTORE_BASE64  the release keystore, base64 (`base64 -w0 tumthai.keystore`). Android only installs an
#                            update signed with the same key as the installed app, so use the key the APKs on
#                            dl.blueskychan.dev were signed with.
#   ANDROID_KEYSTORE_PASS    the keystore's password
#   ANDROID_KEY_PASS         the key's password
#   ANDROID_KEY_ALIAS        the key's alias (tumthai)
# Without them the APK is signed with a throwaway debug key: it installs, but can't update a release install (and
# vice versa); the job summary says so.
#
# Not signed for Apple (there is no Apple developer key): the macOS apps are only ad-hoc signed, so players open them
# the first time with right-click -> Open (or System Settings -> Privacy & Security -> Open Anyway), or run
# `xattr -dr com.apple.quarantine /Applications/TumThai.app`. iOS isn't built: it can't be installed without Apple
# signing.

name: TumThai release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 2026.1012.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tumthai-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The Velopack CLI must match osu.Desktop's Velopack package version.
  VPK_VERSION: 1.2.0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      android_code: ${{ steps.v.outputs.android_code }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,4}\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' should look like 2026.1012.0"
            exit 1
          fi
          # Android versionCode: 2026.1011.2 -> 202610112 (as lazer/build-android.sh; must go up every release).
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d%04d%d", $1, $2, $3 }')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building TumThai **$VERSION** (Android versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (Velopack)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        run: printf -- "-p:Version=%s\n" "$VERSION" > Directory.Build.rsp

      - name: Publish
        run: >
          dotnet publish osu.Desktop/osu.Desktop.csproj -c Release -r win-x64 --self-contained true -f net10.0
          -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Pack (Setup.exe, Portable.zip, update feed)
        run: |
          dotnet tool install vpk --version "$VPK_VERSION" --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/vpk" pack --packId TumThai --packVersion "$VERSION" --packDir publish --mainExe tumthai.exe \
            --packTitle TumThai --packAuthors somtum.fun --icon osu.Desktop/lazer.ico \
            --channel win --delta None --outputDir velopack
          mkdir -p out
          cp velopack/TumThai-win-Setup.exe "out/TumThai-$VERSION-win-Setup.exe"
          cp velopack/TumThai-win-Portable.zip "out/TumThai-$VERSION-win-Portable.zip"
          ls -la velopack out

      - uses: actions/upload-artifact@v7
        with:
          name: tumthai-windows
          path: out/*
          if-no-files-found: error

      # The update feed (dl.blueskychan.dev/lazer/releases): releases.win.json, RELEASES, assets.win.json and the nupkg.
      - uses: actions/upload-artifact@v7
        with:
          name: tumthai-windows-feed
          path: |
            velopack/*.nupkg
            velopack/*.json
            velopack/RELEASES
          if-no-files-found: error

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: x86_64
          # Cross-built: build-osu-appimage.sh runs the host's appimagetool and packs the aarch64 runtime.
          - rid: linux-arm64
            arch: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        run: printf -- "-p:Version=%s\n" "$VERSION" > Directory.Build.rsp

      - name: Build AppImage
        run: |
          bash build-osu-appimage.sh --rid "${{ matrix.rid }}" -r "$VERSION" -o "$RUNNER_TEMP/dist" -w "$RUNNER_TEMP/work"
          mkdir -p out
          cp "$RUNNER_TEMP"/dist/*.AppImage "out/TumThai-$VERSION-${{ matrix.arch }}.AppImage"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: tumthai-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.rid }})
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        run: printf -- "-p:Version=%s\n" "$VERSION" > Directory.Build.rsp

      - name: Publish
        run: >
          dotnet publish osu.Desktop/osu.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -f net10.0
          -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -o "$RUNNER_TEMP/publish"

      - name: Make TumThai.app
        run: |
          bash packaging/macos/make-app.sh "$RUNNER_TEMP/publish" "$RUNNER_TEMP/app" "$VERSION"
          # No Apple developer key: ad-hoc sign the whole bundle (Apple Silicon won't run unsigned code).
          codesign --force --deep --sign - "$RUNNER_TEMP/app/TumThai.app"
          codesign --verify --deep "$RUNNER_TEMP/app/TumThai.app"
          file "$RUNNER_TEMP/app/TumThai.app/Contents/MacOS/tumthai"
          mkdir -p out
          ditto -c -k --keepParent "$RUNNER_TEMP/app/TumThai.app" "out/TumThai-$VERSION-${{ matrix.rid }}.zip"
          ls -la out

      # Velopack's macOS package (a .pkg installer and the in-app update feed). Its own channel per architecture, so
      # its files don't clash with Windows' in lazer/releases. Best effort: the zipped .app above is the download.
      - name: Pack with Velopack
        id: vpk
        continue-on-error: true
        run: |
          dotnet tool install vpk --version "$VPK_VERSION" --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/vpk" pack --packId TumThai --packVersion "$VERSION" --packDir "$RUNNER_TEMP/app/TumThai.app" \
            --mainExe tumthai --packTitle TumThai --packAuthors somtum.fun --icon packaging/macos/lazer.icns \
            --bundleId fun.somtum.tumthai --channel "${{ matrix.rid }}" --delta None \
            --outputDir "$RUNNER_TEMP/velopack"
          ls -la "$RUNNER_TEMP/velopack"

      - uses: actions/upload-artifact@v7
        with:
          name: tumthai-macos-${{ matrix.rid }}
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.vpk.outcome == 'success'
        with:
          name: tumthai-macos-${{ matrix.rid }}-velopack
          path: ${{ runner.temp }}/velopack/*

  android:
    name: Android (arm64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.android_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Signing key
        id: key
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASS" && -n "$ANDROID_KEY_PASS" && -n "$ANDROID_KEY_ALIAS" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tumthai.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Android: signed with the release key (from the repository secrets)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are missing: the APK is signed with a debug key"
            {
              echo "**Android: NOT signed with the release key.** The ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASS /"
              echo "ANDROID_KEY_PASS / ANDROID_KEY_ALIAS secrets aren't set, so this APK has a throwaway debug key: it"
              echo "installs, but can't update an installed release build (Android needs the same key). Don't publish it as an update."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish
        run: |
          SIGNING=()
          if [[ "${{ steps.key.outputs.signed }}" == "true" ]]; then
            # env: makes the build read the passwords from the environment, so they aren't on the command line.
            SIGNING=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/tumthai.keystore"
                     -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                     -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASS)
          fi
          dotnet publish osu.Android/osu.Android.csproj -c Release -f net10.0-android \
            -p:Version="$VERSION" -p:ApplicationVersion="$CODE" -p:TumThaiAndroidAbis=android-arm64 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            "${SIGNING[@]}" -o "$RUNNER_TEMP/android"
          mkdir -p out
          if [[ "${{ steps.key.outputs.signed }}" == "true" ]]; then
            cp "$RUNNER_TEMP"/android/*-Signed.apk "out/TumThai-$VERSION.apk"
          else
            cp "$RUNNER_TEMP"/android/*-Signed.apk "out/TumThai-$VERSION-debugkey.apk"
          fi
          ls -la out

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tumthai.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: tumthai-android
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ version, windows, linux, macos, android ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "TumThai $VERSION" \
            --notes "TumThai $VERSION. Windows: Setup.exe (or the Portable zip). Linux: the AppImage. macOS: the zip for your Mac (osx-arm64 = Apple Silicon, osx-x64 = Intel), unsigned: open it with right-click -> Open the first time, or run xattr -dr com.apple.quarantine on TumThai.app. Android: the .apk."
