name: Add Release to Sentry

on:
  push:
    tags:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  sentry_release:
    # TumThai: ppy's job, skipped on our fork (it needs ppy's secrets or runners, or would use up our Actions minutes).
    if: github.repository == 'ppy/osu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ppy
          SENTRY_PROJECT: osu
          SENTRY_URL: https://sentry.ppy.sh/
        with:
          environment: production
          version: osu@${{ github.ref_name }}
